# =============================================================
#  YOUR SITE SETTINGS — edit the text in quotes below.
#  (After saving, the site rebuilds itself in about a minute.)
# =============================================================

# Your name or brand — shows in the top-left corner and browser tab.
title: "EYESEERC"

# Small spaced-out line shown under the name in the header ("" to hide it).
subtitle: "PRODUCTIONS INC"

# Company name shown in the copyright line at the bottom of every page.
copyright_name: "EYESEERC PRODUCTIONS INC"

# Used by search engines and when your link is shared.
description: "Photography portfolio of EYESEERC."

# Contact details (leave blank "" to hide any of them).
email: "eyeseerc@gmail.com"
instagram: "eyeseerc"   # just the username
youtube: "eyeseerc"     # the channel handle (the part after @)

# Currency symbol used on the Shop page.
currency: "$"

# Print sizes offered for every print (2:3, in inches), smallest first, with
# the price of each. The details box in the shop has a SIZE drop-down with
# these; the shop page shows "From" the first price.
print_sizes:
  - size: "8 × 12"
    price: 50
  - size: "12 × 18"
    price: 75
  - size: "16 × 24"
    price: 110
  - size: "20 × 30"
    price: 160

# Your Shopify store's address, e.g. "eyeseerc.myshopify.com". When this is
# set (and each shop item has a shopify_variant number in _data/shop.yml) the
# cart's CHECK OUT button sends buyers to Shopify's checkout. Until then the
# button says checkout is coming soon.
shopify_store: ""

# -------------------------------------------------------------
#  Technical settings — you normally don't need to touch these.
# -------------------------------------------------------------
markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
