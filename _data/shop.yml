# =============================================================
#  SHOP ITEMS
#  One block per item. They show three to a row, in this order.
#
#  category:  prints or shirts — which button (PRINTS / SHIRTS) shows it
#             (leave it out and it counts as a print)
#  title:     name of the item (used for screen readers / search)
#  image:     a photo you've uploaded, e.g. /photos/photography/color/sunset.jpg
#  shape:     landscape, portrait or square
#  price:     just the number (the currency symbol is set in _config.yml)
#  link:      the product's page on your print site (Fine Art America,
#             Darkroom, Etsy...). Clicking the photo opens it. Leave it
#             empty ("") and clicking the photo opens it big instead.
#  description: a few words about the item, shown in the box under the
#             photo when it's opened (a placeholder is used if left out)
#  more_photos: up to 4 more photos of the item (close-ups, framed, on a
#             wall...). Once the description is showing they sit stacked
#             behind the main photo; tap or swipe to bring each to the front.
#  sold_out:  true  (optional — shows "Sold out" instead of the price)
#  shopify_variant: the item's variant ID number from Shopify (optional —
#             needed for the cart's CHECK OUT button to go to Shopify)
#
#  The items below are TEMPORARY SAMPLES — replace them with your own
#  prints and shirts. Shirt photos can go in the photos/shop folder.
# =============================================================

