{% comment %}
  Round outline icon for a menu item (same style as the light/dark button).
  include.name: home, photography, projects or shop
{% endcomment %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="12" cy="12" r="11.1" stroke-width="1.5"/>
  <g transform="translate(12 12) scale(.5) translate(-12 -12)" stroke-width="2.4">
  {% case include.name %}
    {% when "home" %}
      <path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.6V20h12V9.6"/><path d="M10 20v-5.5h4V20"/>
    {% when "photography" %}
      <rect x="2.5" y="7" width="19" height="13" rx="2.5"/><path d="M8 7l1.7-2.6h4.6L16 7"/><circle cx="12" cy="13.4" r="3.7"/>
    {% when "projects" %}
      <path d="M20.5 3.5 11.8 12.2"/><path d="M11.8 12.2c-1-.9-2.6-.9-3.6.1-1 1-.8 2.4-1.4 3.4-.6 1-1.7 1.4-2.8 1.5 1.3 1.6 3.8 2.6 6.1 1.6 2.4-1 3.1-3.9 1.7-5.4z"/>
    {% when "shop" %}
      <path d="M16.2 7.3C15.4 6 14 5.2 12.2 5.2c-2.3 0-4 1.2-4 3.1 0 4.5 8.3 2.6 8.3 7.2 0 2-1.8 3.3-4.3 3.3-1.9 0-3.5-.8-4.4-2.2"/><path d="M12.2 2.8v18.4"/>
  {% endcase %}
  </g>
</svg>
