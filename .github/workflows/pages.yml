# Builds the site and publishes it with GitHub Pages every time
# something is changed on the main branch.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      # the light versions of the photos (soft previews and the smaller
      # copies the grids show), made fresh from whatever photos are uploaded
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && python tools/make_blur.py
      # the site lives at the root of its own domain (eyeseerc.com), so links
      # are built from "/" (not from the github.io/Eyeseerc-website-/ path)
      - run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
